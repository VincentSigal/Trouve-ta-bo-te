<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="/FRONT_END/CSS/Espace_pro.css">
    <link rel="shortcut icon" href="/FRONT_END/img/logo.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Pro | Trouve ta boîte</title>
</head>

<body>

    <div class="dashboard-page">

        <header id="header" class="dashboard-header">
            <div class="site-branding"> <!-- SLOGAN -->
                <a href="/FRONT_END/HTML/Accueil.html" title="Logo"><img src="/FRONT_END/img/logo.png" alt="Logo Trouve ta boîte"></a>
                <a href="/FRONT_END/HTML/Accueil.html" title="Trouve ta boîte">Espace Pro — Trouve ta boîte</a>
            </div>

            <nav class="main-navigation"> <!-- MENU HEADER -->
                <ul>
                    <li><a href="/FRONT_END/HTML/Accueil.html" title="Accueil">Accueil</a></li>
                    <div class="nav-divider"></div>
                    <li><a href="/FRONT_END/HTML/Boîtes_de_nuit.html" title="Boîtes de nuit">Boîtes de nuit</a></li>
                    <div class="nav-divider"></div>
                    <li><a href="/FRONT_END/HTML/Soirées.html" title="Soirées">Soirées</a></li>
                    <div class="nav-divider"></div>
                    <li><a href="/FRONT_END/HTML/Contact.html" title="Contact">Contact</a></li>
                </ul>
            </nav>

            <button class="logout-btn" id="logoutBtn">Déconnexion</button>
        </header>

        <main class="dashboard-main">

            <div class="dashboard-intro">
                <h1>Bonjour, L'AMNESIA 👋</h1>
                <p>Gérez vos boîtes et vos soirées depuis votre espace professionnel.</p>
            </div>

            <div class="dashboard-grid">

                <!-- ===== COLONNE BOÎTES ===== -->
                <section class="dashboard-column" aria-labelledby="titreBoites">

                    <div class="dashboard-column-header">
                        <h2 id="titreBoites">Vos boîtes</h2>
                        <button class="btn-add" id="btnAddBoite">+ Ajouter une boîte</button>
                    </div>

                    <div class="pro-list" id="boitesList">
                        <!-- Généré dynamiquement par Espace_pro.js -->
                    </div>
                </section>

                <!-- ===== COLONNE SOIRÉES ===== -->
                <section class="dashboard-column" aria-labelledby="titreSoirees">

                    <div class="dashboard-column-header">
                        <h2 id="titreSoirees">Vos soirées</h2>
                        <button class="btn-add" id="btnAddSoiree">+ Ajouter une soirée</button>
                    </div>

                    <div class="pro-list" id="soireesList">
                        <!-- Généré dynamiquement par Espace_pro.js -->
                    </div>
                </section>

            </div>

        </main>

    </div>

    <script src="/FRONT_END/JS/pages/espace_pro.js"></script>

</body>

</html>
